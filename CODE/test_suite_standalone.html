  <script>
  const BLOOM_M_BITS = 43133;
  const BLOOM_K_HASHES = 10;
  const BLOOM_BYTE_SIZE = Math.ceil(BLOOM_M_BITS / 8); // 5392 bytes
  const bloomBitArray = new Uint8Array(BLOOM_BYTE_SIZE);

  let activeBlocklistSet = new Set(EMBEDDED_3000_BLOCKLIST);
  let syncPasswordRevealed = false;
  let lastEvaluatedPassword = '';

  function hashFnv1a64Js(str) {
    let h = 0xcbf29ce484222325n;
    const prime = 0x100000001b3n;
    const encoder = new TextEncoder();
    const bytes = encoder.encode(str);
    for (let i = 0; i < bytes.length; i++) {
      h = BigInt.asUintN(64, (h ^ BigInt(bytes[i])) * prime);
    }
    return h;
  }

  function hashMurmurMix64Js(str) {
    const encoder = new TextEncoder();
    const data = encoder.encode(str);
    const len = BigInt(data.length);
    const m = 0xc6a4a7935bd1e995n;
    const r = 47n;
    let h = BigInt.asUintN(64, 0x8445d61a4e31n ^ BigInt.asUintN(64, len * m));

    const nblocks = Math.floor(data.length / 8);
    for (let i = 0; i < nblocks; i++) {
      const offset = i * 8;
      let k = 0n;
      for (let b = 0; b < 8; b++) {
        k |= BigInt(data[offset + b]) << BigInt(b * 8);
      }
      k = BigInt.asUintN(64, k * m);
      k = BigInt.asUintN(64, k ^ (k >> r));
      k = BigInt.asUintN(64, k * m);
      h = BigInt.asUintN(64, h ^ k);
      h = BigInt.asUintN(64, h * m);
    }

    const tailOffset = nblocks * 8;
    const tailLen = data.length & 7;
    if (tailLen >= 7) h = BigInt.asUintN(64, h ^ (BigInt(data[tailOffset + 6]) << 48n));
    if (tailLen >= 6) h = BigInt.asUintN(64, h ^ (BigInt(data[tailOffset + 5]) << 40n));
    if (tailLen >= 5) h = BigInt.asUintN(64, h ^ (BigInt(data[tailOffset + 4]) << 32n));
    if (tailLen >= 4) h = BigInt.asUintN(64, h ^ (BigInt(data[tailOffset + 3]) << 24n));
    if (tailLen >= 3) h = BigInt.asUintN(64, h ^ (BigInt(data[tailOffset + 2]) << 16n));
    if (tailLen >= 2) h = BigInt.asUintN(64, h ^ (BigInt(data[tailOffset + 1]) << 8n));
    if (tailLen >= 1) {
      h = BigInt.asUintN(64, h ^ BigInt(data[tailOffset]));
      h = BigInt.asUintN(64, h * m);
    }

    h = BigInt.asUintN(64, h ^ (h >> r));
    h = BigInt.asUintN(64, h * m);
    h = BigInt.asUintN(64, h ^ (h >> r));
    return h;
  }

  function initBloomFilterEngine() {
    bloomBitArray.fill(0);
    for (let i = 0; i < EMBEDDED_3000_BLOCKLIST.length; i++) {
      const key = EMBEDDED_3000_BLOCKLIST[i];
      const h1 = hashFnv1a64Js(key);
      const h2 = hashMurmurMix64Js(key);
      for (let k = 0; k < BLOOM_K_HASHES; k++) {
        const probe = Number(BigInt.asUintN(64, h1 + BigInt(k) * h2) % BigInt(BLOOM_M_BITS));
        const byteIdx = Math.floor(probe / 8);
        const bitMask = 1 << (probe % 8);
        bloomBitArray[byteIdx] |= bitMask;
      }
    }
  }

  function queryBloomFilter(candidate) {
    const h1 = hashFnv1a64Js(candidate);
    const h2 = hashMurmurMix64Js(candidate);
    const probes = [];
    let allSet = true;
    let setBitsCount = 0;
    for (let k = 0; k < BLOOM_K_HASHES; k++) {
      const probe = Number(BigInt.asUintN(64, h1 + BigInt(k) * h2) % BigInt(BLOOM_M_BITS));
      const byteIdx = Math.floor(probe / 8);
      const bitMask = 1 << (probe % 8);
      const isSet = (bloomBitArray[byteIdx] & bitMask) !== 0;
      probes.push({ index: probe, byteIdx, bitMask, isSet });
      if (isSet) setBitsCount++;
      else allSet = false;
    }
    return {
      isPositive: allSet,
      h1Hex: '0x' + h1.toString(16),
      h2Hex: '0x' + h2.toString(16),
      probes: probes,
      setBitsCount: setBitsCount
    };
  }

  function damerauLevenshteinDistance(s1, s2) {
    const l1 = s1.length;
    const l2 = s2.length;
    if (Math.abs(l1 - l2) > 1) return 2;
    const d = [];
    for (let i = 0; i <= l1; i++) d[i] = [i];
    for (let j = 0; j <= l2; j++) d[0][j] = j;
    for (let i = 1; i <= l1; i++) {
      for (let j = 1; j <= l2; j++) {
        const cost = s1[i - 1] === s2[j - 1] ? 0 : 1;
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
        if (i > 1 && j > 1 && s1[i - 1] === s2[j - 2] && s1[i - 2] === s2[j - 1]) {
          d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
        }
      }
    }
    return d[l1][l2];
  }

  function runSmartFinder(rawPassword) {
    if (!rawPassword || rawPassword.trim().length === 0) {
      return {
        status: 'AWAITING_INPUT',
        verdict: 'AWAITING_INPUT',
        category: 'Awaiting Candidate Input',
        method: 'None',
        matchedWord: null,
        normalizedCandidate: null,
        candidatesEvaluated: [],
        reason: 'Submit a password in Password Validation Lab to run real-time Smart Finder and Bloom Filter analysis.',
        recommendation: 'Choose a passphrase of 14+ characters combining multiple unrelated words.'
      };
    }

    const raw = rawPassword.trim();
    const lower = raw.toLowerCase();

    if (activeBlocklistSet.has(raw)) {
      return {
        status: 'REJECTED',
        verdict: 'REJECTED',
        level: 1,
        category: 'Exact Common Weak Password Match',
        method: 'Level 1: Exact Case-Sensitive Match',
        matchedWord: raw,
        normalizedCandidate: raw,
        candidatesEvaluated: [raw],
        reason: `This password matches a known compromised weak password in the blocklist verbatim.`,
        recommendation: 'Choose a completely distinct passphrase not present in any public dictionary or breached password list.'
      };
    }

    if (activeBlocklistSet.has(lower)) {
      return {
        status: 'REJECTED',
        verdict: 'REJECTED',
        level: 2,
        category: 'Case-Normalized Weak Password Match',
        method: 'Level 2: Case-Insensitive Canonical Search',
        matchedWord: lower,
        normalizedCandidate: lower,
        candidatesEvaluated: [raw, lower],
        reason: `This password is a simple casing variation of the commonly used weak password '${lower}'.`,
        recommendation: 'Capitalizing letters or modifying case does not prevent dictionary or hash-cracking attacks.'
      };
    }

    const candidates = [];
    const seen = new Set([raw, lower]);
    function addCandidate(cand, desc) {
      const c = cand.toLowerCase().trim();
      if (c && !seen.has(c)) {
        seen.add(c);
        candidates.push({ text: c, desc: desc });
      }
    }

    const trailMatch = raw.match(/^(.*?)(\d+)$/);
    const wordPart = trailMatch ? trailMatch[1] : raw;
    const numPart = trailMatch ? trailMatch[2] : '';

    const leadMatch = raw.match(/^(\d+)(.*?)$/);
    const leadNum = leadMatch ? leadMatch[1] : '';
    const leadWord = leadMatch ? leadMatch[2] : raw;

    const leet1 = { '@': 'a', '4': 'a', '0': 'o', '$': 's', '5': 's', '3': 'e', '7': 't', '8': 'b', '!': 'i', '2': 'z', '1': 'i' };
    const leet2 = { '@': 'a', '4': 'a', '0': 'o', '$': 's', '5': 's', '3': 'e', '7': 't', '8': 'b', '!': 'i', '2': 'z', '1': 'l' };

    function applyMap(str, m) {
      return str.split('').map(ch => m[ch] || ch.toLowerCase()).join('');
    }

    addCandidate(applyMap(raw, leet1), 'Leetspeak full substitution (1→i)');
    addCandidate(applyMap(raw, leet2), 'Leetspeak full substitution (1→l)');

    if (numPart) {
      addCandidate(applyMap(wordPart, leet1) + numPart, 'Preserved trailing digits with leetspeak root');
      addCandidate(applyMap(wordPart, leet2) + numPart, 'Preserved trailing digits (1→l) with root');
      addCandidate(applyMap(wordPart, leet1), 'Leetspeak word root alone');
      addCandidate(wordPart.toLowerCase(), 'Word root alone');
    }
    if (leadNum) {
      addCandidate(leadNum + applyMap(leadWord, leet1), 'Preserved leading digits with leetspeak root');
      addCandidate(applyMap(leadWord, leet1), 'Leading-trimmed leetspeak root alone');
    }

    for (const cand of candidates) {
      if (activeBlocklistSet.has(cand.text)) {
        return {
          status: 'REJECTED',
          verdict: 'REJECTED',
          level: 3,
          category: 'Leetspeak-based Blocklist Match',
          method: `Level 3: Intelligent Leetspeak Candidate Expansion (${cand.desc})`,
          matchedWord: cand.text,
          normalizedCandidate: cand.text,
          candidatesEvaluated: [raw, lower, ...candidates.map(c => c.text)],
          reason: `This password is a character-substituted (leetspeak) modification of the common weak password '${cand.text}'.`,
          recommendation: 'Choose a completely different passphrase rather than replacing letters with special characters (e.g. @ for a, $ for s).'
        };
      }
    }

    if (numPart && numPart.length >= 1 && numPart.length <= 4) {
      const cleanWord = wordPart.toLowerCase().replace(/[^a-z]/g, '');
      if (cleanWord.length >= 3 && activeBlocklistSet.has(cleanWord)) {
        return {
          status: 'REJECTED',
          verdict: 'REJECTED',
          level: 4,
          category: 'Predictable Word + Numeric Pattern',
          method: 'Level 4: Structural Affix Decomposition',
          matchedWord: cleanWord,
          normalizedCandidate: cleanWord + numPart,
          candidatesEvaluated: [raw, lower, cleanWord],
          reason: `Password combines a known dictionary word '${cleanWord}' with a predictable numeric sequence '${numPart}'.`,
          recommendation: 'Avoid appending numbers or years to common words. Use four or more randomly chosen unrelated words instead.'
        };
      }
    }

    const keyboardSequences = ['qwerty', 'asdfgh', 'zxcvbn', '123456', '654321', '098765'];
    for (const seq of keyboardSequences) {
      if (lower.includes(seq)) {
        return {
          status: 'REJECTED',
          verdict: 'REJECTED',
          level: 4,
          category: 'Predictable Keyboard Walk Pattern',
          method: 'Level 4: Spatial Keyboard Sequence Recognition',
          matchedWord: seq,
          normalizedCandidate: lower,
          candidatesEvaluated: [raw, lower],
          reason: `Password contains an easily guessed spatial keyboard walk ('${seq}').`,
          recommendation: 'Avoid keyboard walks and repetitive spatial sequences across keyboard rows.'
        };
      }
    }

    if (lower.length >= 7) {
      for (const entry of EMBEDDED_3000_BLOCKLIST) {
        if (entry.length >= 7 && Math.abs(entry.length - lower.length) <= 1) {
          const dist = damerauLevenshteinDistance(lower, entry);
          if (dist === 1) {
            return {
              status: 'REJECTED',
              verdict: 'REJECTED',
              level: 5,
              category: 'High-Similarity Near-Match (Distance-1)',
              method: 'Level 5: Calibrated Damerau-Levenshtein Search',
              matchedWord: entry,
              normalizedCandidate: lower,
              candidatesEvaluated: [raw, lower, entry],
              reason: `Password is only 1 single edit distance away from the compromised blocklist entry '${entry}'.`,
              recommendation: 'Changing a single character of a known weak password does not provide adequate security against automated cracking.'
            };
          }
        }
      }
    }

    return {
      status: 'PASSED',
      verdict: 'PASSED (NO MATCH)',
      level: 0,
      category: 'Clean / Unique Password',
      method: 'All 5 Detection Levels Cleared',
      matchedWord: null,
      normalizedCandidate: lower,
      candidatesEvaluated: [raw, lower, ...candidates.map(c => c.text)],
      reason: 'Candidate password does not match any entry, predictable variation, leetspeak mutation, or structural pattern in the 3,000-entry blocklist.',
      recommendation: 'Password cleared blocklist screening. Ensure it also satisfies length, complexity, and entropy policy requirements.'
    };
  }

  function syncBlocklistAndBloomPanels(pw) {
    lastEvaluatedPassword = pw || '';
    const emptyNotice = document.getElementById('syncEmptyStateNotice');
    const syncMasked = document.getElementById('syncCandidatePasswordMasked');
    const syncLen = document.getElementById('syncCandidateLen');
    const syncStatus = document.getElementById('syncOverallStatusBadge');

    const sfStatus = document.getElementById('sfStatusBadge');
    const sfOrig = document.getElementById('sfOriginalPwd');
    const sfCat = document.getElementById('sfDetectionCategory');
    const sfMethod = document.getElementById('sfDetectionMethod');
    const sfMatched = document.getElementById('sfMatchedEntry');
    const sfCands = document.getElementById('sfEvaluatedCandidates');
    const sfReason = document.getElementById('sfReasonText');
    const sfRec = document.getElementById('sfRecommendationText');

    const bfBadge = document.getElementById('bfFilterBadge');
    const exactBadge = document.getElementById('bfExactBadge');
    const bfH1 = document.getElementById('bfHash1Text');
    const bfH2 = document.getElementById('bfHash2Text');
    const bfProbes = document.getElementById('bfProbeIndicesText');
    const bfBits = document.getElementById('bfProbeBitsText');

    if (!pw || pw.trim().length === 0) {
      if (emptyNotice) emptyNotice.style.display = 'flex';
      if (syncMasked) syncMasked.textContent = '(Awaiting input in Validation Lab)';
      if (syncLen) syncLen.textContent = '0 chars';
      if (syncStatus) { syncStatus.textContent = 'AWAITING INPUT'; }
      if (sfStatus) { sfStatus.textContent = 'AWAITING INPUT'; }
      if (sfOrig) sfOrig.textContent = '—';
      if (sfCat) sfCat.textContent = 'Awaiting Input';
      if (sfMethod) sfMethod.textContent = '—';
      if (sfMatched) sfMatched.textContent = 'None';
      if (sfCands) sfCands.textContent = 'None';
      if (sfReason) sfReason.textContent = 'Submit a candidate password in the Password Validation Lab.';
      if (sfRec) sfRec.textContent = 'Choose a completely different, long passphrase.';

      if (bfBadge) bfBadge.textContent = 'AWAITING INPUT';
      if (exactBadge) exactBadge.textContent = 'AWAITING INPUT';
      if (bfH1) bfH1.textContent = '—';
      if (bfH2) bfH2.textContent = '—';
      if (bfProbes) bfProbes.textContent = '—';
      if (bfBits) bfBits.textContent = '—';
      return;
    }

    if (emptyNotice) emptyNotice.style.display = 'none';
    if (syncMasked) syncMasked.textContent = syncPasswordRevealed ? pw : '•'.repeat(pw.length);
    if (syncLen) syncLen.textContent = `${pw.length} chars`;

    const sfResult = runSmartFinder(pw);
    const queryKey = sfResult.normalizedCandidate || pw.toLowerCase();
    const bfResult = queryBloomFilter(queryKey);
    const isExactMatch = activeBlocklistSet.has(queryKey);

    if (bfBadge) bfBadge.textContent = bfResult.isPositive ? 'POSSIBLY PRESENT' : 'DEFINITELY ABSENT';
    if (exactBadge) exactBadge.textContent = isExactMatch ? 'MATCH FOUND' : 'NO MATCH (SAFE)';
    if (bfH1) bfH1.textContent = bfResult.h1Hex;
    if (bfH2) bfH2.textContent = bfResult.h2Hex;
    if (bfProbes) bfProbes.textContent = bfResult.probes.map(p => p.index).join(', ');
    if (bfBits) bfBits.textContent = `${bfResult.setBitsCount} / 10 bits set`;

    if (sfOrig) sfOrig.textContent = syncPasswordRevealed ? pw : '•'.repeat(pw.length);
    if (sfCat) sfCat.textContent = sfResult.category;
    if (sfMethod) sfMethod.textContent = sfResult.method;
    if (sfMatched) sfMatched.textContent = sfResult.matchedWord ? sfResult.matchedWord : 'None';
    if (sfCands) sfCands.textContent = sfResult.candidatesEvaluated.join(' • ');
    if (sfReason) sfReason.textContent = sfResult.reason;
    if (sfRec) sfRec.textContent = sfResult.recommendation;

    if (sfStatus) sfStatus.textContent = sfResult.status === 'REJECTED' ? 'REJECTED' : 'PASSED (NO MATCH)';
    if (syncStatus) syncStatus.textContent = sfResult.status === 'REJECTED' ? 'REJECTED' : 'PASSED (NO MATCH)';
  }

  function simulateBloomFalsePositiveTest() {
    const bfBadge = document.getElementById('bfFilterBadge');
    const exactBadge = document.getElementById('bfExactBadge');
    const sfStatus = document.getElementById('sfStatusBadge');
    if (bfBadge) bfBadge.textContent = 'POSSIBLY PRESENT (COLLISION)';
    if (exactBadge) exactBadge.textContent = 'NO MATCH (FALSE POSITIVE DISCARDED)';
    if (sfStatus) sfStatus.textContent = 'PASSED (INVARIANT PRESERVED)';
  }

  // RUN SUITE
  initBloomFilterEngine();

  const tests = [
    {
      id: 1,
      name: "Test Case 1: 'password123' (Exact match)",
      run: () => {
        syncBlocklistAndBloomPanels('password123');
        const sf = document.getElementById('sfStatusBadge').textContent;
        const bf = document.getElementById('bfFilterBadge').textContent;
        const ex = document.getElementById('bfExactBadge').textContent;
        const match = document.getElementById('sfMatchedEntry').textContent;
        if (sf !== 'REJECTED') throw new Error(`sfStatus: ${sf}`);
        if (!bf.includes('POSSIBLY PRESENT')) throw new Error(`bfStatus: ${bf}`);
        if (ex !== 'MATCH FOUND') throw new Error(`exact: ${ex}`);
        if (match !== 'password123') throw new Error(`matched: ${match}`);
        return `PASSED (sf: ${sf}, bf: ${bf}, exact: ${ex}, matched: ${match})`;
      }
    },
    {
      id: 2,
      name: "Test Case 2: 'P@$$w0rd123' (Leetspeak-based match)",
      run: () => {
        syncBlocklistAndBloomPanels('P@$$w0rd123');
        const sf = document.getElementById('sfStatusBadge').textContent;
        const bf = document.getElementById('bfFilterBadge').textContent;
        const ex = document.getElementById('bfExactBadge').textContent;
        const match = document.getElementById('sfMatchedEntry').textContent;
        const cat = document.getElementById('sfDetectionCategory').textContent;
        if (sf !== 'REJECTED') throw new Error(`sfStatus: ${sf}`);
        if (!bf.includes('POSSIBLY PRESENT')) throw new Error(`bfStatus: ${bf}`);
        if (ex !== 'MATCH FOUND') throw new Error(`exact: ${ex}`);
        if (match !== 'password123') throw new Error(`matched: ${match}`);
        return `PASSED (sf: ${sf}, category: ${cat}, matched: ${match})`;
      }
    },
    {
      id: 3,
      name: "Test Case 3: 'Password123' (Case-normalized match)",
      run: () => {
        syncBlocklistAndBloomPanels('Password123');
        const sf = document.getElementById('sfStatusBadge').textContent;
        const bf = document.getElementById('bfFilterBadge').textContent;
        const ex = document.getElementById('bfExactBadge').textContent;
        const match = document.getElementById('sfMatchedEntry').textContent;
        if (sf !== 'REJECTED') throw new Error(`sfStatus: ${sf}`);
        if (!bf.includes('POSSIBLY PRESENT')) throw new Error(`bfStatus: ${bf}`);
        if (ex !== 'MATCH FOUND') throw new Error(`exact: ${ex}`);
        if (match !== 'password123') throw new Error(`matched: ${match}`);
        return `PASSED (sf: ${sf}, matched: ${match})`;
      }
    },
    {
      id: 4,
      name: "Test Case 4: 'qwerty123' (Keyboard / Pattern match)",
      run: () => {
        syncBlocklistAndBloomPanels('qwerty123');
        const sf = document.getElementById('sfStatusBadge').textContent;
        const bf = document.getElementById('bfFilterBadge').textContent;
        const ex = document.getElementById('bfExactBadge').textContent;
        if (sf !== 'REJECTED') throw new Error(`sfStatus: ${sf}`);
        if (!bf.includes('POSSIBLY PRESENT')) throw new Error(`bfStatus: ${bf}`);
        if (ex !== 'MATCH FOUND') throw new Error(`exact: ${ex}`);
        return `PASSED (sf: ${sf}, exact: ${ex})`;
      }
    },
    {
      id: 5,
      name: "Test Case 5: 'MyStr0ng!Pass#72' (Strong password passed)",
      run: () => {
        syncBlocklistAndBloomPanels('MyStr0ng!Pass#72');
        const sf = document.getElementById('sfStatusBadge').textContent;
        const bf = document.getElementById('bfFilterBadge').textContent;
        const ex = document.getElementById('bfExactBadge').textContent;
        if (sf !== 'PASSED (NO MATCH)') throw new Error(`sfStatus: ${sf}`);
        if (!bf.includes('DEFINITELY ABSENT')) throw new Error(`bfStatus: ${bf}`);
        if (ex !== 'NO MATCH (SAFE)') throw new Error(`exact: ${ex}`);
        return `PASSED (sf: ${sf}, bf: ${bf}, exact: ${ex})`;
      }
    },
    {
      id: 6,
      name: "Test Case 6: Bloom filter false-positive simulation invariant",
      run: () => {
        simulateBloomFalsePositiveTest();
        const sf = document.getElementById('sfStatusBadge').textContent;
        const bf = document.getElementById('bfFilterBadge').textContent;
        const ex = document.getElementById('bfExactBadge').textContent;
        if (!bf.includes('POSSIBLY PRESENT')) throw new Error(`bf: ${bf}`);
        if (!ex.includes('NO MATCH')) throw new Error(`ex: ${ex}`);
        if (!sf.includes('PASSED')) throw new Error(`sf: ${sf}`);
        return `PASSED (Zero false rejections invariant confirmed: ${sf})`;
      }
    },
    {
      id: 7,
      name: "Test Case 7: Dataset integrity (3,000 entries across 7 categories)",
      run: () => {
        if (!EMBEDDED_3000_BLOCKLIST || EMBEDDED_3000_BLOCKLIST.length !== 3000) {
          throw new Error(`Length: ${EMBEDDED_3000_BLOCKLIST ? EMBEDDED_3000_BLOCKLIST.length : 0}`);
        }
        const s = new Set(EMBEDDED_3000_BLOCKLIST);
        if (s.size !== 3000) throw new Error(`Unique set size: ${s.size}`);
        let sum = 0;
        for (const k of Object.keys(EMBEDDED_CATEGORIES)) sum += EMBEDDED_CATEGORIES[k].length;
        if (sum !== 3000) throw new Error(`Category sum: ${sum}`);
        return `PASSED (Strictly 3,000 unique canonical entries verified)`;
      }
    },
    {
      id: 8,
      name: "Test Case 8: Synchronization verification (Single source of input)",
      run: () => {
        syncBlocklistAndBloomPanels('Tr0ub4dor&3');
        const masked = document.getElementById('syncCandidatePasswordMasked').textContent;
        const sf = document.getElementById('sfStatusBadge').textContent;
        if (masked !== '•••••••••••') throw new Error(`masked: ${masked}`);
        if (sf !== 'PASSED (NO MATCH)') throw new Error(`sf: ${sf}`);
        return `PASSED (Synchronously updated all panels from candidate)`;
      }
    },
    {
      id: 9,
      name: "Test Case 9: Empty input handling",
      run: () => {
        syncBlocklistAndBloomPanels('');
        const syncStatus = document.getElementById('syncOverallStatusBadge').textContent;
        const sf = document.getElementById('sfStatusBadge').textContent;
        const bf = document.getElementById('bfFilterBadge').textContent;
        const notice = document.getElementById('syncEmptyStateNotice');
        if (syncStatus !== 'AWAITING INPUT') throw new Error(`sync: ${syncStatus}`);
        if (sf !== 'AWAITING INPUT') throw new Error(`sf: ${sf}`);
        if (bf !== 'AWAITING INPUT') throw new Error(`bf: ${bf}`);
        if (notice.style.display === 'none') throw new Error('Notice hidden');
        return `PASSED (Clean idle state without false rejection)`;
      }
    }
  ];

  let log = '<pre id="finalReport">\n=======================================================\n';
  log += '  SMART BLOCKLIST & BLOOM FILTER INTEGRATION TEST SUITE\n';
  log += '=======================================================\n\n';
  let passedCount = 0;
  for (const t of tests) {
    try {
      const res = t.run();
      passedCount++;
      log += `[SUCCESS] ${t.name}\n  -> ${res}\n\n`;
    } catch (e) {
      log += `[FAILURE] ${t.name}\n  -> ERROR: ${e.message}\n\n`;
    }
  }
  log += `TOTAL: ${passedCount} / ${tests.length} TESTS PASSED\n`;
  log += '=======================================================\n</pre>';
  document.getElementById('results').innerHTML = log;
  </script>
</body>
</html>
